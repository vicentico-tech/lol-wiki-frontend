<div class="search-container">
  <!-- Top Center R Badge -->
  <div class="badge-r">
    <div class="badge-inner">R</div>
  </div>

  <div class="search-frame">
    <!-- Overlay de grietas decorativas -->
    <div class="cracks-overlay">
      <svg viewBox="0 0 800 60" preserveAspectRatio="none">
        <!-- Grietas sutiles dibujadas con SVG -->
        <path d="M 50 5 L 60 20 L 55 35" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" fill="none" />
        <path d="M 750 55 L 740 40 L 745 25" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" fill="none" />
        <path d="M 200 5 L 210 15 L 205 25 L 220 30" stroke="rgba(0,0,0,0.4)" stroke-width="1" fill="none" />
        <path d="M 600 55 L 590 45 L 595 35 L 580 30" stroke="rgba(0,0,0,0.4)" stroke-width="1" fill="none" />
        <path d="M 350 5 L 345 15 L 355 20" stroke="rgba(0,0,0,0.3)" stroke-width="1" fill="none" />
      </svg>
    </div>

    <div class="search-inner">
      <!-- Left Rune -->
      <div class="rune rune-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6L9 12l6 6"></path>
          <circle cx="9" cy="12" r="1" fill="currentColor"></circle>
        </svg>
      </div>

      <input type="text" 
             placeholder="Busca campeones, objetos o historia..." 
             (input)="onSearchInput($event)"
             (focus)="onFocus()"
             (blur)="onBlur()" />

      <button class="search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Right Rune -->
      <div class="rune rune-right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6l6 6-6 6"></path>
          <circle cx="15" cy="12" r="1" fill="currentColor"></circle>
        </svg>
      </div>
    </div>
  </div>

  <!-- Resultados del buscador -->
  <div class="search-dropdown" *ngIf="showDropdown && searchResults.length > 0">
    <div class="dropdown-item" *ngFor="let result of searchResults">
      <img [src]="result.icon" [alt]="result.name" class="result-icon">
      <div class="result-info">
        <span class="result-name">{{ result.name }}</span>
        <span class="result-subtitle">{{ result.subtitle | titlecase }}</span>
      </div>
      <span class="result-type">{{ result.type === 'champion' ? 'Campeón' : 'Objeto' }}</span>
    </div>
  </div>
</div>
