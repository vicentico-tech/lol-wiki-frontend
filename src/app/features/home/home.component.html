<div class="home-container">
  <div class="header">
    <h2 class="logo-title lol-text">LEAGUE <span class="of-text">of</span> LEGENDS</h2>
    <h1 class="main-title lol-text">EL WIKI DE<br>LA COMUNIDAD</h1>
    <p class="subtitle lol-text">TU FUENTE DE<br>CONOCIMIENTO SOBRE<br>LA GRIETA.</p>
  </div>

  <app-search-bar
    (championSelected)="onChampionSelected($event)"
    (itemSelected)="onItemSelected($event)">
  </app-search-bar>

  <app-champion-detail
    *ngIf="selected?.type === 'champion'"
    [championId]="selected!.id"
    (close)="selected = null">
  </app-champion-detail>

  <app-item-detail
    *ngIf="selected?.type === 'item'"
    [itemId]="selected!.id"
    (close)="selected = null">
  </app-item-detail>

  <div class="bottom-section">
    <div class="featured-box">
      <span class="gold-text">DESTACADO:</span>
      Biografía Completa de Aatrox
    </div>

    <div class="nav-grid">
      <div class="nav-row">
        <app-nav-button text="CAMPEONES">
          <svg icon viewBox="0 0 24 24"><path d="M12 2C8 2 4 5 4 10v4c0 3 2 5 2 8h2v-4h8v4h2c0-3 2-5 2-8v-4c0-5-4-8-8-8zm0 14L9 12h6l-3 4z"/></svg>
        </app-nav-button>
        <app-nav-button text="OBJETOS">
          <svg icon viewBox="0 0 24 24"><path d="M4 4v16h16V4H4zm14 14H6V6h12v12zm-3-3H9V9h6v6z"/></svg>
        </app-nav-button>
      </div>
      <div class="nav-row">
        <app-nav-button text="HABILIDADES">
          <svg icon viewBox="0 0 24 24"><path d="M15 3c-2.8 0-4.8 1.4-6.2 3.3C7.5 7.9 6 10.3 5 13c2.3-1.3 5-1.5 7.5-1 1-1.3 2.5-3 4.5-4 1.7-.8 3.5-1 5-1-1 3.8-3 6.6-6 8.5 1.5.5 3 1.5 4.5 3-2.5-.5-5.5-.3-8 1.5C9 22 7 20 6 17c-2 1.3-4.5 1.5-6 1 1-2.5 3.5-4.5 6-5.5C7.2 8.7 9 5.3 12.5 3c.8-.5 1.6-.7 2.5-.8z"/></svg>
        </app-nav-button>
        <app-nav-button text="MAPAS">
          <svg icon viewBox="0 0 24 24"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3zm1 12.8l-4 2V5.2l4-2v14.6z"/></svg>
        </app-nav-button>
        <app-nav-button text="COMUNIDAD">
          <svg icon viewBox="0 0 24 24"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
        </app-nav-button>
      </div>
    </div>
  </div>
</div>
